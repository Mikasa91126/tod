    }
    return out;
  },

  /** 每秒巡检：到点入队，过期太久的静默作废 */
  check(){
    const now = Date.now();
    const catchupMs = (Store.settings.catchupHours==null?12:Store.settings.catchupHours)*3600e3;
    const due = [];
    let dirty = false;
    for(const t of Store.tasks){
      if(t.deleted || t.done) continue;
      const at = this.computeAt(t);
      if(at == null || at > now) continue;
      const key = this.key(t, at);
      if(Store.firedKeys[key]) continue;
      if(now - at > catchupMs){
        Store.firedKeys[key] = -now; // 负数 = 静默作废，不再提醒
        dirty = true;
        continue;
      }
      due.push({ key, taskId:t.id, text:t.text, at, persist:!!t.remindPersist });
    }
    if(dirty) Store.saveAux();
    if(due.length) this.enqueue(due);
  },

  enqueue(items){
    for(const it of items){
      if(Store.firedKeys[it.key]) continue;
      if(this.queue.some(q=>q.key===it.key)) continue;
      if(this.current && this.current.key===it.key) continue;
      this.queue.push(it);
    }
    this.showNext();
  },

  showNext(){
    if(this.current || !this.queue.length) return;
    this.current = this.queue.shift();
    Alarm.show(this.current);
  },

  /** 处理一条提醒：action = 'done' | 'snooze5' | 'snooze10' | 'snooze30' | 'close' */
  ack(item, action){
    if(!item) return;
    Store.firedKeys[item.key] = Date.now();
    if(item.taskId && item.taskId !== '__focus__'){
      const t = Store.tasks.find(x => x.id === item.taskId);
      if(action === 'done' && t && !t.done) Ops.toggle(t.id);
      if(action === 'snooze5')  Ops.snooze(item.taskId, 5);
      if(action === 'snooze10') Ops.snooze(item.taskId, 10);
      if(action === 'snooze30') Ops.snooze(item.taskId, 30);
    }
    Store.saveAux();
    this.current = null;
    Alarm.hide();
    Companion.syncReminders();
    Render.all();
    setTimeout(() => this.showNext(), 400);
  },

  /** 页面加载后处理「离开期间后台已经弹过的提醒」 */
  handleRecentFired(list){
    if(!Array.isArray(list) || !list.length) return;
    const fresh = list.filter(r => !Store.firedKeys[r.key]);
    if(!fresh.length) return;
    for(const r of fresh) Store.firedKeys[r.key] = r.at || Date.now();
    Store.saveAux();
    const names = fresh.slice(0,2).map(r => (r.text||'').slice(0,14)).join('、');
    Toast.show(`离开期间有 ${fresh.length} 条提醒已触发：${names}${fresh.length>2?'…':''}`);
  },
};

/* ═══════════════════════════════════════════════════════════════
   ALARM（闹钟弹窗 + 提示音 + 标题闪烁）
   ═══════════════════════════════════════════════════════════════ */
const Alarm = {
  item: null,
  _soundTimer: null,
  _titleTimer: null,
  _ctx: null,
  _stopAt: 0,

  show(item){
    this.item = item;
    const card = $('#alarmCard');
    const isFocus = item.taskId === '__focus__';
    card.innerHTML = `
      <div class="alarm-icon">${isFocus ? '🍅' : '⏰'}</div>
      <div class="alarm-kicker">${isFocus ? '专注结束' : '任务提醒'}</div>
      <div class="alarm-title">${esc(item.text || '未命名任务')}</div>
      <div class="alarm-meta">${esc(fmtDateTime(item.at))} · ${esc(relativeTime(item.at))}${item.persist ? ' · 重要提醒' : ''}</div>
      <div class="alarm-actions">
        ${isFocus ? '' : '<button class="alarm-btn done" data-alarm="done">✓ 标记完成</button>'}
        <div class="row">
          <button class="alarm-btn" data-alarm="snooze5">稍后 5 分钟</button>
          <button class="alarm-btn" data-alarm="snooze10">10 分钟</button>
          <button class="alarm-btn" data-alarm="snooze30">30 分钟</button>
        </div>
        <button class="alarm-btn" data-alarm="close">关闭提醒</button>
      </div>`;
    $('#alarmOverlay').classList.add('open');
    this.startSound();
    this.startTitleFlash(item.text);
    this.notifySystem(item);
  },

  hide(){
    this.item = null;
    $('#alarmOverlay').classList.remove('open');
    this.stopSound();
    this.stopTitleFlash();
    Title.update();
  },

  /** 后台服务不在时，用浏览器通知兜底（file:// 下可能被拒绝，失败即忽略） */
  notifySystem(item){
    try{
      if(Companion.alive) return;            // 后台会弹系统通知，避免重复
      if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
      const n = new Notification('今日事 · 任务提醒', { body: item.text || '', tag: item.key, requireInteraction: true });
      n.onclick = () => { window.focus(); n.close(); };
    }catch(e){}
  },

  _beep(kind){
    if(kind === 'none') return;
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      if(!this._ctx) this._ctx = new Ctx();
      const ctx = this._ctx;
      if(ctx.state === 'suspended') ctx.resume();
      const seq = kind === 'alarm'
        ? [[1046.5,0,.11],[1046.5,.17,.11],[1046.5,.34,.11],[1046.5,.51,.11]]
        : kind === 'beep'
          ? [[1000,0,.1],[1000,.15,.1]]
          : [[880,0,.16],[1174.66,.17,.16],[1567.98,.34,.3]];
      const t0 = ctx.currentTime + .02;
      for(const [freq, off, dur] of seq){
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = kind === 'beep' ? 'square' : 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(.0001, t0+off);
        gain.gain.exponentialRampToValueAtTime(.26, t0+off+.02);
        gain.gain.exponentialRampToValueAtTime(.0001, t0+off+dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0+off); osc.stop(t0+off+dur+.03);
      }
    }catch(e){}
  },

  startSound(){
    const kind = Store.settings.sound || 'chime';
    this.stopSound();
    if(kind === 'none') return;
    this._stopAt = Date.now() + 60000;   // 最多响 1 分钟
    this._beep(kind);
    this._soundTimer = setInterval(() => {
      if(Date.now() > this._stopAt){ this.stopSound(); return; }
      this._beep(kind);
    }, 3000);
  },

  stopSound(){
    if(this._soundTimer){ clearInterval(this._soundTimer); this._soundTimer = null; }
  },

  startTitleFlash(text){
    this.stopTitleFlash();
    const flash = '⏰ 提醒：' + String(text||'').slice(0,18);
    let on = false;
    this._titleTimer = setInterval(() => {
      on = !on;
      document.title = on ? flash : Title.base();
    }, 800);
  },

  stopTitleFlash(){
    if(this._titleTimer){ clearInterval(this._titleTimer); this._titleTimer = null; }
  },
};

/* ═══════════════════════════════════════════════════════════════
   TITLE（窗口标题 / 任务栏计数）
   ═══════════════════════════════════════════════════════════════ */
const Title = {
  base(){
    const c = Query.counts();
    const today = todayStr();
    const dueToday = Store.tasks.filter(t => !t.deleted && !t.done && t.dueDate === today).length;
    let t = '今日事';
    if(c.active) t += ' (' + c.active + ')';
    if(dueToday) t += ' · ' + dueToday + ' 项今日到期';
    else if(c.overdue) t += ' · ' + c.overdue + ' 项已逾期';
    return t;
  },
  update(){
    if(Alarm.item) return;                 // 提醒闪烁期间不抢标题
    if(Focus.running){
      document.title = '⏱ ' + Focus.clockText() + ' · ' + Focus.taskText().slice(0,16);
      return;
    }
    document.title = this.base();
  },
};

/* ═══════════════════════════════════════════════════════════════
   COMPANION（与后台服务通信：状态同步 / 提醒同步 / 备份）
   ═══════════════════════════════════════════════════════════════ */
const Companion = {
  port: null,
  alive: false,
  version: 0,
  revision: 0,
  recentFired: [],
  _pushTimer: null,
  _remTimer: null,
  _pollTimer: null,
  _retryTimer: null,

  url(path){ return 'http://127.0.0.1:' + this.port + path; },

  async probe(port, timeout){
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeout || 400);
    try{
      const res = await fetch('http://127.0.0.1:' + port + '/api/ping', { signal: ctl.signal, cache:'no-store' });
      clearTimeout(timer);
      if(!res.ok) return null;
      const data = await res.json();
      return (data && data.name === 'today-server') ? data : null;
    }catch(e){ clearTimeout(timer); return null; }
  },

  /** 依次尝试 URL 参数 / 当前端口 / 8788-8798，找到后台服务 */
  async discover(){
    const candidates = [];
    try{
      const qp = parseInt(new URLSearchParams(location.search).get('port'), 10);
      if(qp) candidates.push(qp);
    }catch(e){}
    const lp = parseInt(location.port, 10);
    if(lp) candidates.push(lp);
    for(let p = 8788; p <= 8798; p++) if(candidates.indexOf(p) < 0) candidates.push(p);

    const results = await Promise.all(candidates.map(p => this.probe(p, 450).then(info => info ? { port:p, info } : null)));
    const hit = results.find(Boolean);
    if(hit){ await this.onConnect(hit.port, hit.info); return true; }
    this.onDisconnect();
    return false;
  },

  async onConnect(port, info){
    const first = !this.alive;
    this.port = port;
    this.alive = true;
    this.version = info.version || 0;
    this.revision = info.revision || this.revision || 0;
    this.renderStatus();
    if(first){
      await this.pull();
      this.recentFired = info.recentFired || [];
      Reminders.handleRecentFired(this.recentFired);
      await this.syncReminders();
      await this.push();
      this.startPolling();
    }
  },

  onDisconnect(){
    const was = this.alive;
    this.alive = false;
    this.renderStatus();
    this.stopPolling();
    if(was) Toast.show('后台服务已断开：提醒将只在页面打开时生效');
    if(this._retryTimer) clearTimeout(this._retryTimer);
    this._retryTimer = setTimeout(() => this.discover(), 60000);
  },

  startPolling(){
    this.stopPolling();
    this._pollTimer = setInterval(() => this.pull(), 15000);
  },

  stopPolling(){
    if(this._pollTimer){ clearInterval(this._pollTimer); this._pollTimer = null; }
  },

  renderStatus(){
    const chip = $('#companionChip'), dot = $('#companionDot'), text = $('#companionText');
    if(!chip) return;
    dot.className = 'status-dot ' + (this.alive ? 'on' : 'off');
    text.textContent = this.alive ? ('后台已连接 :' + this.port) : '仅浏览器模式';
    chip.classList.toggle('on', this.alive);
    const banner = $('#modeBanner');
    if(banner){
      const hide = this.alive || Store.settings.bannerDismissed;
      banner.classList.toggle('hidden', hide);
    }
  },

  /** 拉取后台任务并合并（后台更旧则回推） */
  async pull(){
    if(!this.alive) return;
    try{
      const res = await fetch(this.url('/api/state'), { cache:'no-store' });
      const data = await res.json();
      if(!data || !data.ok) return;
      if(data.revision > this.revision){
        this.revision = data.revision;
        this.adopt(data.tasks);
      }
    }catch(e){ this.onDisconnect(); }
  },

  adopt(remoteTasks){
    if(!Array.isArray(remoteTasks)) return;
    const merged = mergeTaskLists(Store.tasks, remoteTasks);
    if(JSON.stringify(merged) === JSON.stringify(Store.tasks)) return;
    Store.saving = true;
    Store.tasks = merged;
    Store.save();
    Store.saving = false;
    Render.all();
  },

  /** 本地有改动 → 防抖回推 */
  onLocalChange(){
    if(!this.alive) return;
    if(this._pushTimer) clearTimeout(this._pushTimer);
    this._pushTimer = setTimeout(() => this.push(), 2000);
    if(this._remTimer) clearTimeout(this._remTimer);
    this._remTimer = setTimeout(() => this.syncReminders(), 1000);
  },

  async push(){
    if(!this.alive) return;
    try{
      const res = await fetch(this.url('/api/state'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tasks: Store.tasks, revision: this.revision }),
      });
      const data = await res.json();
      if(data && data.ok){
        this.revision = data.revision;
        this.adopt(data.tasks);
      }
    }catch(e){ this.onDisconnect(); }
  },

  async syncReminders(){
    if(!this.alive) return;
    try{
      await fetch(this.url('/api/reminders'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ items: Reminders.pending(), catchupHours: Store.settings.catchupHours }),
      });
    }catch(e){ this.onDisconnect(); }
  },

  async backup(){
    if(!this.alive) return null;
    try{
      const res = await fetch(this.url('/api/backup'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tasks: Store.tasks }),
      });
      const data = await res.json();
      return (data && data.ok) ? data.name : null;
    }catch(e){ this.onDisconnect(); return null; }
  },

  async listBackups(){
    if(!this.alive) return [];
    try{
      const res = await fetch(this.url('/api/backups'), { cache:'no-store' });
      const data = await res.json();
      return (data && data.ok) ? (data.items||[]) : [];
    }catch(e){ this.onDisconnect(); return []; }
  },

  async restoreBackup(name){
    if(!this.alive) return false;
    try{
      const res = await fetch(this.url('/api/backup?name=' + encodeURIComponent(name)), { cache:'no-store' });
      const tasks = await res.json();
      if(!Array.isArray(tasks)) return false;
      Store.tasks = mergeTaskLists(Store.tasks, tasks.map(normalizeTask));
      Store.save();
      Render.all();
      return true;
    }catch(e){ this.onDisconnect(); return false; }
  },
};

/** 任务列表合并：顺序以本地为准，同 id 取 updatedAt 更新的，远端独有的追加到末尾 */
function mergeTaskLists(local, remote){
  const out = (local||[]).slice();
  const index = new Map(out.map((t,i) => [t.id, i]));
  for(const r of (remote||[])){
    if(!r || !r.id) continue;
    const n = normalizeTask(Object.assign({}, r));
    const i = index.get(n.id);
    if(i === undefined){
      index.set(n.id, out.length);
      out.push(n);
    } else if((n.updatedAt||0) > (out[i].updatedAt||0)){
      out[i] = n;
    }
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   SIDE PANEL（侧栏 / 抽屉，四个标签）
   ═══════════════════════════════════════════════════════════════ */
const SidePanel = {
  isWide(){ return window.innerWidth >= 1100; },

  open(tab){
    const target = tab || Store.sideTab || 'detail';
    // 已经是当前标签时只切显示，不重渲染（否则与 detailPanel 互相递归）
    if(target !== Store.sideTab) this.setTab(target);
    else this.applyTab(target);
    if(!this.isWide()){
      $('#detailPanel').classList.add('open');
      $('#detailOverlay').classList.add('open');
    }
  },

  close(){
    $('#detailPanel').classList.remove('open');
    $('#detailOverlay').classList.remove('open');
  },

  /** 只切换标签与面板显隐，不触发内容重渲染 */
  applyTab(name){
    Store.sideTab = name;
    $$('.side-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    $$('.side-pane').forEach(p => { p.hidden = p.dataset.pane !== name; });
    Store.saveAux();
  },

  /** 切换标签并刷新该标签内容 */
  setTab(name){
    this.applyTab(name);
    this.refreshPane(name);
  },

  refreshPane(name){
    if(name === 'calendar') Calendar.render();
    if(name === 'stats') Render.renderStats();
    if(name === 'focus') Focus.render();
    if(name === 'detail') Render.detailPanel(Store.tasks.find(t => t.id === Store.detailId && !t.deleted) || null);
  },

  init(){
    $$('.side-tab').forEach(b => b.addEventListener('click', () => this.setTab(b.dataset.tab)));
    $('#calendarToggle').addEventListener('click', () => this.open('calendar'));
    $('#statsToggle').addEventListener('click', () => this.open('stats'));
    $('#focusToggle').addEventListener('click', () => this.open('focus'));
    window.addEventListener('resize', () => { if(this.isWide()) this.close(); });
    this.setTab(Store.sideTab || 'detail');
    if(this.isWide()) this.close();
  },
};

/* ═══════════════════════════════════════════════════════════════
   ACTIONS（供右键菜单 / 快捷键复用的快捷操作）
   ═══════════════════════════════════════════════════════════════ */
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => Toast.show('已复制到剪贴板')).catch(() => fallback());
  } else fallback();
  function fallback(){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      Toast.show('已复制到剪贴板');
    }catch(e){ Toast.show('复制失败，请手动选择复制'); }
  }
}

/** 弹窗动作的一次性监听（供模块级代码使用；触发后自动解绑，避免污染后续弹窗） */
function onModalActionOnce(handler){
  const content = $('#modalContent');
  const fn = e => {
    const act = e.target.dataset.modalAction;
    if(!act) return;
    content.removeEventListener('click', fn);
    handler(act);
  };
  content.addEventListener('click', fn);
}

const Actions = {
  setDue(id, dateStr, label){
    Ops.update(id, { dueDate: dateStr });
    Render.all();
    Toast.show('截止日期：' + (label || fmtDate(dateStr)));
  },
  clearDue(id){
    Ops.update(id, { dueDate: null, dueTime: null });
    Render.all();
    Toast.show('已清除截止日期');
  },
  setPriority(id, p){
    Ops.update(id, { priority: p });
    Render.all();
    Toast.show('优先级：' + PRIORITIES[p]);
  },
  setCategory(id, c){
    Ops.update(id, { category: c || null });
    Render.all();
    Toast.show('分类：' + (c ? CATEGORIES[c].label : '无'));
  },
  remindIn(id, minutes){
    Ops.setRemind(id, Date.now() + minutes*60000);
    Render.all();
    Toast.show(`将在 ${minutes} 分钟后提醒`);
  },
  remindTonight(id){
    const d = new Date(); d.setHours(20,0,0,0);
    if(d.getTime() <= Date.now()) d.setDate(d.getDate()+1);
    Ops.setRemind(id, d.getTime());
    Render.all();
    Toast.show('将在 ' + fmtDateTime(d.getTime()) + ' 提醒');
  },
  remindCustom(id){
    const t = Store.tasks.find(x => x.id === id);
    if(!t) return;
    const cur = Reminders.computeAt(t);
    const d = cur ? new Date(cur) : new Date(Date.now() + 3600e3);
    Render.modal('设置提醒时间', `
      <div class="detail-group">
        <span class="detail-label">日期</span>
        <input type="date" id="remindDate" value="${localDateStr(d)}" style="padding:10px 12px;border:1.5px solid var(--c-border);border-radius:var(--r-sm);background:var(--c-surface);color:var(--c-text)">
      </div>
      <div class="detail-group">
        <span class="detail-label">时间</span>
        <input type="time" id="remindTime" value="${pad2(d.getHours())}:${pad2(d.getMinutes())}" style="padding:10px 12px;border:1.5px solid var(--c-border);border-radius:var(--r-sm);background:var(--c-surface);color:var(--c-text)">
      </div>
      <p style="font-size:var(--fs-sm);color:var(--c-text-tertiary)">提示：也可以只设时间不设日期，就是一个「纯提醒」。</p>`,
      [{ key:'cancel', label:'取消', cls:'secondary' }, { key:'ok', label:'确定', cls:'primary' }]);
    onModalActionOnce(act => {
      if(act === 'ok'){
        const ts = parseLocalDateTime($('#remindDate').value, $('#remindTime').value);
        if(ts){ Ops.setRemind(id, ts); Render.all(); Toast.show('提醒已设为 ' + fmtDateTime(ts)); }
        else Toast.show('时间无效');
        Render.closeModal();
      }
      if(act === 'cancel') Render.closeModal();
    });
  },
  toggleRemind(id){
    const t = Store.tasks.find(x => x.id === id);
    if(!t) return;
    if(Reminders.computeAt(t) != null || t.remindAt){ Ops.setRemind(id, null); Render.all(); Toast.show('已关闭提醒'); }
    else { this.remindCustom(id); }
  },
  focusTask(id){ Focus.start(id); SidePanel.open('focus'); },
  deleteTask(id){
    const t = Store.tasks.find(x => x.id === id);
    if(!t) return;
    Ops.softDelete(id);
    if(Store.detailId === id) Render.closeDetail();
    Render.all();
    Toast.show(`已删除「${t.text.slice(0,20)}」`, '撤销', () => { Ops.restore(id); Render.all(); });
  },
};

/* ═══════════════════════════════════════════════════════════════
   CALENDAR（日历 / 周视图）
   ═══════════════════════════════════════════════════════════════ */
const Calendar = {
  view: null,
  DOW: ['一','二','三','四','五','六','日'],

  ensure(){
    if(!this.view){
      const d = new Date();
      this.view = new Date(d.getFullYear(), d.getMonth(), 1);
    }
  },

  shiftMonth(delta){
    this.ensure();
    this.view = new Date(this.view.getFullYear(), this.view.getMonth() + delta, 1);
    this.render();
  },

  gotoToday(){
    const d = new Date();
    this.view = new Date(d.getFullYear(), d.getMonth(), 1);
    this.select(todayStr());
  },

  select(dateStr){
    Store.dateFilter = (Store.dateFilter === dateStr) ? null : dateStr;
    Store.todayView = false;
    Store.filter = 'all';
    $$('.filter-pill').forEach(x => x.classList.toggle('active', x.dataset.filter === 'all'));
    $('#todayPill').classList.remove('active');
    this.render();
    Render.all();
  },

  render(){
    this.ensure();
    const wrap = $('#calendarWrap');
    if(!wrap) return;
    const y = this.view.getFullYear(), m = this.view.getMonth();
    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() + 6) % 7;   // 周一为第一列
    const gridStart = new Date(y, m, 1 - startOffset);
    const today = todayStr();
    const sel = Store.dateFilter;

    // 月历格子（6 行 × 7 列）
    let cells = '';
    for(let i = 0; i < 42; i++){
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const key = localDateStr(d);
      const list = Query.byDate(key);
      const overdue = list.some(t => !t.done && key < today);
      const cats = [...new Set(list.map(t => t.category).filter(c => c && CATEGORIES[c]))].slice(0,3);
      const dots = cats.map(c => `<span class="cal-dot" style="background:${CATEGORIES[c].color}"></span>`).join('');
      const more = list.length > 3 ? `<span class="cal-more">+${list.length-3}</span>` : '';
      const cls = ['cal-cell'];
      if(d.getMonth() !== m) cls.push('out');
      if(key === today) cls.push('today');
      if(key === sel) cls.push('selected');
      if(overdue) cls.push('overdue');
      cells += `<div class="${cls.join(' ')}" data-cal-day="${key}" title="${key}${list.length?' · '+list.length+' 项':''}">
        <span>${d.getDate()}</span>
        <span class="cal-dots">${dots}${more}</span>
      </div>`;
    }

    // 本周概览（周一起）
    const now = new Date(); now.setHours(0,0,0,0);
    const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay()+6)%7));
    let week = '';
    for(let i = 0; i < 7; i++){
      const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+i);
      const key = localDateStr(d);
      const n = Query.byDate(key).filter(t => !t.done).length;
      const cls = ['cal-week-day'];
      if(key === today) cls.push('today');
      if(key === sel) cls.push('selected');
      week += `<div class="${cls.join(' ')}" data-cal-day="${key}">
        <span>${this.DOW[i]}</span><span class="n">${d.getDate()}</span><span class="c">${n?n+' 项':'—'}</span>
      </div>`;
    }

    // 选中日期的任务清单
    const focusDate = sel || today;
    const dayList = Query.byDate(focusDate);
    const listHtml = dayList.length
      ? dayList.map(t => {
          const time = t.dueTime || '';
          const cat = t.category ? CATEGORIES[t.category] : null;
          return `<div class="cal-list-item ${t.done?'done':''}" data-cal-task="${t.id}">
            <span class="cal-dot" style="background:${cat?cat.color:'var(--c-text-tertiary)'}"></span>
            <span class="t">${esc(t.text)}</span>
            <span class="tm">${time || (t.done?'已完成':'')}</span>
          </div>`;
        }).join('')
      : '<div class="cal-hint">这一天没有安排任务。</div>';

    wrap.innerHTML = `
      <div class="cal-head">
        <div class="cal-title">${y} 年 ${m+1} 月</div>
        <div class="cal-nav">
          <button data-cal="prev" title="上个月">‹</button>
          <button class="cal-today-btn" data-cal="today">今天</button>
          <button data-cal="next" title="下个月">›</button>
        </div>
      </div>
      <div class="cal-week">${week}</div>
      <div class="cal-grid">
        ${this.DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div>
        <div class="cal-title" style="margin-bottom:8px">${fmtMonthDay(focusDate)}${focusDate===today?' · 今天':''}</div>
        <div class="cal-list">${listHtml}</div>
      </div>
      <div class="cal-hint">💡 点日期格筛选当天任务；把左侧任务卡片拖到格子上可直接改期。</div>`;
  },

  init(){
    const wrap = $('#calendarWrap');
    wrap.addEventListener('click', e => {
      const nav = e.target.closest('[data-cal]');
      if(nav){
        const act = nav.dataset.cal;
        if(act === 'prev') this.shiftMonth(-1);
        if(act === 'next') this.shiftMonth(1);
        if(act === 'today') this.gotoToday();
        return;
      }
      const day = e.target.closest('[data-cal-day]');
      if(day){ this.select(day.dataset.calDay); return; }
      const item = e.target.closest('[data-cal-task]');
      if(item){ Render.detailPanel(Store.tasks.find(t => t.id === item.dataset.calTask)); SidePanel.open('detail'); }
    });
    // 拖拽任务卡到日期格子 = 改期
    wrap.addEventListener('dragover', e => {
      const cell = e.target.closest('[data-cal-day]');
      if(!cell) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      $$('.cal-cell.drag-over').forEach(c => c.classList.remove('drag-over'));
      cell.classList.add('drag-over');
    });
    wrap.addEventListener('dragleave', e => {
      const cell = e.target.closest('[data-cal-day]');
      if(cell) cell.classList.remove('drag-over');
    });
    wrap.addEventListener('drop', e => {
      const cell = e.target.closest('[data-cal-day]');
      if(!cell) return;
      e.preventDefault();
      $$('.cal-cell.drag-over').forEach(c => c.classList.remove('drag-over'));
      const id = e.dataTransfer.getData('text/plain');
      if(!id) return;
      const t = Store.tasks.find(x => x.id === id);
      if(!t) return;
      Actions.setDue(id, cell.dataset.calDay, fmtDate(cell.dataset.calDay));
      this.render();
    });
  },
};

/* ═══════════════════════════════════════════════════════════════
   FOCUS（番茄钟 / 专注计时）
   ═══════════════════════════════════════════════════════════════ */
const Focus = {
  taskId: null,
  minutes: 25,
  mode: 'work',      // 'work' | 'break'
  endAt: 0,
  remainMs: 0,
  running: false,
  paused: false,
  _timer: null,
  R: 80,

  taskText(){
    const t = Store.tasks.find(x => x.id === this.taskId);
    return t ? t.text : (this.mode === 'break' ? '休息一下' : '未选择任务');
  },

  clockText(){
    const ms = this.running ? Math.max(0, this.endAt - Date.now()) : this.remainMs;
    const total = Math.ceil(ms/1000);
    return pad2(Math.floor(total/60)) + ':' + pad2(total%60);
  },

  start(taskId, minutes){
    const t = taskId ? Store.tasks.find(x => x.id === taskId && !x.deleted) : null;
    this.taskId = t ? t.id : null;
    this.mode = 'work';
    this.minutes = minutes || Store.settings.focusMinutes || 25;
    this.endAt = Date.now() + this.minutes*60000;
    this.remainMs = this.minutes*60000;
    this.running = true;
    this.paused = false;
    this.persistState();
    this.render();
    Title.update();
    Companion.syncReminders();
    Toast.show(`专注开始 · ${this.minutes} 分钟`);
  },

  startBreak(){
    this.mode = 'break';
    this.minutes = Store.settings.breakMinutes || 5;
    this.endAt = Date.now() + this.minutes*60000;
    this.remainMs = this.minutes*60000;
    this.running = true;
    this.paused = false;
    this.persistState();
    this.render();
    Title.update();
    Companion.syncReminders();
    Toast.show(`休息 ${this.minutes} 分钟`);
  },

  pause(){
    if(!this.running) return;
    this.remainMs = Math.max(0, this.endAt - Date.now());
    this.running = false;
    this.paused = true;
    this.persistState();
    this.render();
    Title.update();
  },

  resume(){
    if(this.running) return;
    this.endAt = Date.now() + (this.remainMs || this.minutes*60000);
    this.running = true;
    this.paused = false;
    this.persistState();
    this.render();
    Title.update();
    Companion.syncReminders();
  },

  stop(){
    this.running = false;
    this.paused = false;
    this.remainMs = 0;
    this.endAt = 0;
    this.taskId = null;
    this.mode = 'work';
    this.persistState();
    this.render();
    Title.update();
    Companion.syncReminders();
  },

  toggleFromSelection(){
    if(this.running){ this.pause(); return; }
    if(this.paused){ this.resume(); return; }
    this.start(Store.selectedId || Store.detailId);
  },

  /** 时间戳倒计时：每秒算一次剩余，不受后台标签页节流影响 */
  tick(){
    if(!this.running) return;
    if(Date.now() >= this.endAt){ this.finish(); return; }
    const ring = $('#focusRingFg');
    if(ring){
      const circ = 2*Math.PI*this.R;
      const left = Math.max(0, this.endAt - Date.now());
      const ratio = left / (this.minutes*60000);
      ring.setAttribute('stroke-dashoffset', String(circ * (1 - ratio)));
    }
    const clock = $('#focusClock');
    if(clock) clock.textContent = this.clockText();
    if(Store.sideTab === 'focus' && !document.hidden) Title.update();
  },

  finish(){
    const wasWork = this.mode === 'work';
    const minutes = this.minutes;
    const taskId = this.taskId;
    const text = this.taskText();
    this.running = false;
    this.paused = false;
    this.remainMs = 0;
    this.endAt = 0;
    this.taskId = null;
    if(wasWork){
      Store.focusLog.push({ taskId, text, startedAt: Date.now() - minutes*60000, minutes, completed: true });
      Store.saveAux();
    }
    this.render();
    Title.update();
    Companion.syncReminders();
    Reminders.enqueue([{
      key: 'focus@' + Date.now(),
      taskId: wasWork ? taskId : '__focus__',
      text: (wasWork ? '专注结束：' : '休息结束：') + text,
      at: Date.now(),
      persist: false,
    }]);
    if(wasWork && Store.settings.autoCompleteOnFocusEnd && taskId){
      const t = Store.tasks.find(x => x.id === taskId);
      if(t && !t.done){ Ops.toggle(taskId); Render.all(); }
    }
  },

  persistState(){
    try{
      localStorage.setItem(FOCUS_STATE_KEY, JSON.stringify({
        taskId:this.taskId, minutes:this.minutes, mode:this.mode,
        endAt:this.endAt, remainMs:this.remainMs, running:this.running, paused:this.paused,
      }));
    }catch(e){}
  },

  restoreState(){
    try{
      const s = JSON.parse(localStorage.getItem(FOCUS_STATE_KEY) || 'null');
      if(!s) return;
      if(s.running && s.endAt > Date.now()){
        Object.assign(this, { taskId:s.taskId, minutes:s.minutes, mode:s.mode||'work', endAt:s.endAt, remainMs:s.remainMs, running:true, paused:false });
      } else if(s.paused && s.remainMs > 0){
        Object.assign(this, { taskId:s.taskId, minutes:s.minutes, mode:s.mode||'work', remainMs:s.remainMs, running:false, paused:true });
      }
    }catch(e){}
  },

  render(){
    const wrap = $('#focusWrap');
    if(!wrap) return;
    const circ = 2*Math.PI*this.R;
    const ratio = this.running ? Math.max(0, (this.endAt - Date.now()) / (this.minutes*60000)) : (this.paused ? this.remainMs/(this.minutes*60000) : 1);
    const s = Query.stats();
    const log = Store.focusLog.slice(-6).reverse();
    const selected = Store.tasks.find(t => t.id === (this.taskId || Store.selectedId || Store.detailId) && !t.deleted && !t.done);

    wrap.innerHTML = `
      <div class="focus-ring ${this.mode==='break'?'break':''}">
        <svg viewBox="0 0 176 176">
          <circle class="bg" cx="88" cy="88" r="${this.R}"/>
          <circle class="fg" id="focusRingFg" cx="88" cy="88" r="${this.R}"
            stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-ratio)}"/>
        </svg>
        <div class="focus-ring-text">
          <span id="focusClock">${this.clockText()}</span>
          <small>${this.running ? (this.mode==='break'?'休息中':'专注中') : (this.paused ? '已暂停' : '待开始')}</small>
        </div>
      </div>
      <div class="focus-task">${esc(this.running || this.paused ? this.taskText() : (selected ? selected.text : '先在左侧选中一个任务，或直接开始'))}</div>
      <div class="focus-btns">
        ${this.running
          ? '<button class="modal-btn secondary" data-focus="pause">暂停</button><button class="modal-btn secondary" data-focus="stop" style="color:var(--c-danger)">放弃</button>'
          : this.paused
            ? '<button class="modal-btn primary" data-focus="resume">继续</button><button class="modal-btn secondary" data-focus="stop" style="color:var(--c-danger)">放弃</button>'
            : `<button class="modal-btn primary" data-focus="start">开始专注 ${Store.settings.focusMinutes||25} 分钟</button><button class="modal-btn secondary" data-focus="break">休息 ${Store.settings.breakMinutes||5} 分钟</button>`}
      </div>
      ${!this.running && !this.paused ? `
        <div class="focus-presets">
          ${[15,25,45,60].map(m => `<button class="quick-chip ${(Store.settings.focusMinutes||25)===m?'active':''}" data-focus="start-min" data-val="${m}">${m} 分钟</button>`).join('')}
        </div>` : ''}
      <div class="focus-stats">
        <span>今日专注 <b>${s.focus.todayCount}</b> 次</span>
        <span>共 <b>${s.focus.todayMinutes}</b> 分钟</span>
        <span>连续打卡 <b>${s.streak}</b> 天</span>
      </div>
      ${log.length ? `<div class="focus-log">${log.map(f => `
        <div class="focus-log-item">
          <span class="t">${esc(f.text||'专注')}</span>
          <span class="m">${f.minutes} 分钟 · ${fmtClock(f.startedAt)}</span>
        </div>`).join('')}</div>` : ''}`;
  },

  init(){
    this.restoreState();
    $('#focusWrap').addEventListener('click', e => {
      const btn = e.target.closest('[data-focus]');
      if(!btn) return;
      const act = btn.dataset.focus;
      if(act === 'start') this.start(Store.selectedId || Store.detailId);
      if(act === 'start-min') this.start(Store.selectedId || Store.detailId, parseInt(btn.dataset.val,10));
      if(act === 'break') this.startBreak();
      if(act === 'pause') this.pause();
      if(act === 'resume') this.resume();
      if(act === 'stop') this.stop();
    });
    this._timer = setInterval(() => this.tick(), 1000);
    this.render();
  },
};

/* ═══════════════════════════════════════════════════════════════
   CONTEXT MENU（右键菜单）
   ═══════════════════════════════════════════════════════════════ */
const ContextMenu = {
  targetId: null,

  isOpen(){ return $('#ctxMenu').classList.contains('open'); },

  item(label, icon, action, val, cls, key){
    return `<button class="ctx-item ${cls||''}" data-ctx="${action}" data-val="${val==null?'':val}">
      <span class="ctx-ico">${icon||''}</span><span>${label}</span>${key?`<span class="ctx-key">${key}</span>`:''}
    </button>`;
  },

  taskItems(id){
    const t = Store.tasks.find(x => x.id === id);
    if(!t) return [];
    const remind = Reminders.computeAt(t);
    return [
      this.item(t.done ? '标记为未完成' : '标记为完成', t.done?'↩':'✓', 'toggle', null, null, '空格'),
      this.item('打开详情', '✎', 'detail', null, null, 'Enter'),
      { sep:true },
      { label:'优先级' },
      this.item('高', '🔴', 'pri', 'high'),
      this.item('中', '🟠', 'pri', 'medium'),
      this.item('低', '🟢', 'pri', 'low'),
      this.item('无', '⚪', 'pri', 'none'),
      { sep:true },
      { label:'截止日期' },
      this.item('今天', '📅', 'due', todayStr()),
      this.item('明天', '📅', 'due', localDateStr(new Date(Date.now()+864e5))),
      this.item('下周一', '📅', 'due', localDateStr(nextWeekday(1))),
      this.item('自定义…', '🗓️', 'dueCustom'),
      this.item('清除日期', '✖', 'dueClear'),
      { sep:true },
      { label:'提醒' },
      this.item('15 分钟后', '⏰', 'remindIn', 15),
      this.item('1 小时后', '⏰', 'remindIn', 60),
      this.item('今晚 20:00', '🌙', 'remindTonight'),
      this.item('自定义…', '⏱️', 'remindCustom'),
      remind != null ? this.item('关闭提醒（' + fmtDateTime(remind) + '）', '🔕', 'remindOff') : '',
      { sep:true },
      { label:'分类' },
      this.item('工作', '🏷️', 'cat', 'work'),
      this.item('个人', '🏷️', 'cat', 'personal'),
      this.item('学习', '🏷️', 'cat', 'study'),
      this.item('健康', '🏷️', 'cat', 'health'),
      this.item('无', '🏷️', 'cat', ''),
      { sep:true },
      this.item('开始专注', '🍅', 'focus'),
      this.item('复制任务标题', '📋', 'copy'),
      this.item('删除任务', '🗑️', 'delete', null, 'danger', 'Del'),
    ].filter(Boolean).join('');
  },

  emptyItems(){
    return [
      this.item('添加任务', '➕', 'add', null, null, 'Ctrl+N'),
      this.item('全部展开', '⇣', 'expandAll'),
      this.item('全部折叠', '⇡', 'collapseAll'),
      { sep:true },
      this.item('打开日历', '📅', 'calendar'),
      this.item('打开统计', '📊', 'stats'),
      this.item('刷新界面', '🔄', 'refresh'),
    ].join('');
  },

  open(x, y, html){
    const el = $('#ctxMenu');
    el.innerHTML = html;
    el.classList.add('open');
    const r = el.getBoundingClientRect();
    el.style.left = clamp(x, 6, window.innerWidth - r.width - 6) + 'px';
    el.style.top  = clamp(y, 6, window.innerHeight - r.height - 6) + 'px';
  },

  close(){ $('#ctxMenu').classList.remove('open'); },

  onClick(e){
    const btn = e.target.closest('[data-ctx]');
    if(!btn) return;
    const act = btn.dataset.ctx, val = btn.dataset.val, id = this.targetId;
    this.close();
    switch(act){
      case 'toggle': if(id){ Ops.toggle(id); Render.all(); } break;
      case 'detail': if(id){ Render.detailPanel(Store.tasks.find(t=>t.id===id)); SidePanel.open('detail'); } break;
      case 'pri': if(id) Actions.setPriority(id, val); break;
      case 'cat': if(id) Actions.setCategory(id, val); break;
      case 'due': if(id) Actions.setDue(id, val); break;
      case 'dueCustom': if(id) Actions.remindCustom && pickDate(id); break;
      case 'dueClear': if(id) Actions.clearDue(id); break;
      case 'remindIn': if(id) Actions.remindIn(id, parseInt(val,10)); break;
      case 'remindTonight': if(id) Actions.remindTonight(id); break;
      case 'remindCustom': if(id) Actions.remindCustom(id); break;
      case 'remindOff': if(id) Actions.toggleRemind(id); break;
      case 'focus': if(id) Actions.focusTask(id); break;
      case 'copy': if(id){ const t = Store.tasks.find(t=>t.id===id); if(t) copyToClipboard(t.text); } break;
      case 'delete': if(id) Actions.deleteTask(id); break;
      case 'add': $('#taskInput').focus(); break;
      case 'expandAll': Store.tasks.forEach(t => { if(t.subtasks.length || t.notes) Store.expandedIds.add(t.id); }); Render.all(); break;
      case 'collapseAll': Store.expandedIds.clear(); Render.all(); break;
      case 'calendar': SidePanel.open('calendar'); break;
      case 'stats': SidePanel.open('stats'); break;
      case 'refresh': Render.all(); Toast.show('已刷新'); break;
    }
  },

  init(){
    const el = $('#ctxMenu');
    el.addEventListener('click', e => this.onClick(e));
    document.addEventListener('contextmenu', e => {
      if(e.target.closest('#ctxMenu')) return;
      const card = e.target.closest('.task-card');
      if(card){
        e.preventDefault();
        this.targetId = card.dataset.id;
        Keyboard.select(this.targetId);
        this.open(e.clientX, e.clientY, this.taskItems(this.targetId));
        return;
      }
      if(e.target.closest('#taskList')){
        e.preventDefault();
        this.targetId = null;
        this.open(e.clientX, e.clientY, this.emptyItems());
      }
    });
    document.addEventListener('click', e => { if(!e.target.closest('#ctxMenu')) this.close(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') this.close(); });
    window.addEventListener('resize', () => this.close());
    window.addEventListener('scroll', () => this.close(), true);
  },
};

/** 下一个周几（1=周一 … 0=周日），总是返回未来日期 */
function nextWeekday(target){
  const d = new Date(); d.setHours(0,0,0,0);
  let diff = (target - d.getDay() + 7) % 7;
  if(diff === 0) diff = 7;
  d.setDate(d.getDate() + diff);
  return d;
}

/* ═══════════════════════════════════════════════════════════════
   KEYBOARD（全键盘操作）
   ═══════════════════════════════════════════════════════════════ */
const Keyboard = {
  isTyping(e){
    const el = e.target;
    if(!el || !el.tagName) return false;
    const tag = el.tagName.toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
  },

  overlayOpen(){
    return $('#modalOverlay').classList.contains('open') || Tutorial.isActive() || !!Alarm.item || ContextMenu.isOpen();
  },

  select(id){
    Store.selectedId = id;
    $$('.task-card').forEach(c => c.classList.toggle('selected', c.dataset.id === id));
    const el = $('.task-card[data-id="' + id + '"]');
    if(el) el.scrollIntoView({ block:'nearest' });
    Store.saveAux();
  },

  currentIndex(list){
    const i = list.findIndex(t => t.id === Store.selectedId);
    return i < 0 ? -1 : i;
  },

  move(delta){
    const list = Query.getFiltered();
    if(!list.length) return;
    let i = this.currentIndex(list);
    i = i < 0 ? (delta > 0 ? 0 : list.length-1) : clamp(i + delta, 0, list.length-1);
    this.select(list[i].id);
  },

  toggleSelected(){
    const id = Store.selectedId;
    if(!id) return;
    Ops.toggle(id);
    Render.all();
    this.select(id);
  },

  openSelected(){
    const id = Store.selectedId;
    if(!id) return;
    Render.detailPanel(Store.tasks.find(t => t.id === id));
    SidePanel.open('detail');
  },

  deleteSelected(){
    const id = Store.selectedId;
    if(!id) return;
    const list = Query.getFiltered();
    const i = this.currentIndex(list);
    Actions.deleteTask(id);
    const next = Query.getFiltered()[Math.min(i, Query.getFiltered().length-1)];
    this.select(next ? next.id : null);
  },

  onKey(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return false;
    if(this.isTyping(e) || this.overlayOpen()) return false;
    const k = e.key;
    if(k === 'ArrowDown' || k === 'j'){ this.move(1); e.preventDefault(); return true; }
    if(k === 'ArrowUp' || k === 'k'){ this.move(-1); e.preventDefault(); return true; }
    if(k === ' '){ this.toggleSelected(); e.preventDefault(); return true; }
    if(k === 'Enter' || k === 'e' || k === 'E'){ this.openSelected(); e.preventDefault(); return true; }
    if(k === 'Delete'){ this.deleteSelected(); e.preventDefault(); return true; }
    if(k === '1'){ Filters.set('all'); return true; }
    if(k === '2'){ Filters.set('active'); return true; }
    if(k === '3'){ Filters.set('completed'); return true; }
    if(k === 't' || k === 'T'){ Filters.toggleToday(); return true; }
    if(k === 'p' || k === 'P'){ Focus.toggleFromSelection(); return true; }
    if(k === '?'){ Tutorial.start(); return true; }
    return false;
  },

  init(){
    document.addEventListener('keydown', e => { this.onKey(e); });
  },
};

  updateFooter(){

  updateStatsPanel(){
    if(Store.sideTab === 'stats') this.renderStats();
    if(Store.sideTab === 'calendar') Calendar.render();
    if(Store.sideTab === 'focus') Focus.render();
  },

  renderStats(){
    const s = Query.stats();
    const ring = $('#statsRing');
    const circ = 2*Math.PI*31;
    const offset = circ - (s.completionRate/100)*circ;
    ring.innerHTML = `
      <svg viewBox="0 0 76 76">
        <circle class="bg" cx="38" cy="38" r="31"/>
        <circle class="fg" cx="38" cy="38" r="31" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="stats-ring-text">${s.completionRate}%</div>`;

    $('#statsInfo').innerHTML = `
      <div class="stats-info-item">📋 总任务：<strong>${s.total}</strong></div>
      <div class="stats-info-item">✅ 已完成：<strong>${s.done}</strong></div>
      <div class="stats-info-item">📌 进行中：<strong>${s.active}</strong></div>
      <div class="stats-info-item">⏰ 已逾期：<strong>${s.overdue}</strong></div>
      <div class="stats-info-item">🎯 今日完成：<strong>${s.todayDone}</strong></div>`;

    const maxCat = Math.max(1, ...Object.values(s.byCat).map(c=>c.total));
    $('#statsCats').innerHTML = Object.entries(CATEGORIES).map(([k,v]) => {
      const data = s.byCat[k];
      const pct = Math.round(data.total/maxCat*100);
      const rate = data.total ? Math.round(data.done/data.total*100) : 0;
      return `<div class="stats-cat-row">
        <span class="stats-cat-dot" style="background:${v.color}"></span>
        <span style="width:40px;font-size:var(--fs-sm)">${v.label}</span>
        <div class="stats-cat-bar"><div class="stats-cat-bar-fill" style="width:${pct}%;background:${v.color}"></div></div>
        <span style="font-size:var(--fs-sm);color:var(--c-text-secondary)">${data.total} (${rate}%)</span>
      </div>`;
    }).join('');

    const extra = $('#statsExtra');
    if(extra) extra.innerHTML = this.statsExtraHtml(s);
  },

  /** 近 7 天趋势 + 连续打卡 + 专注（纯 SVG，无依赖） */
  statsExtraHtml(s){
    const W = 300, H = 84, pad = 6;
    const max = Math.max(1, ...s.trend.map(d => d.done));
    const step = (W - pad*2) / (s.trend.length - 1 || 1);
    const pts = s.trend.map((d,i) => {
      const x = pad + i*step;
      const y = H - pad - (d.done/max) * (H - pad*2 - 12);
      return { x, y, d };
    });
    const line = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const area = `${pad},${H-pad} ${line} ${(pad + (pts.length-1)*step).toFixed(1)},${H-pad}`;
    return `
      <div class="set-section" style="margin-top:4px">近 7 天完成趋势</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:84px;overflow:visible">
        <polygon points="${area}" fill="var(--c-accent-muted)"/>
        <polyline points="${line}" fill="none" stroke="var(--c-accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--c-accent)"/>`).join('')}
        ${pts.map(p => `<text x="${p.x.toFixed(1)}" y="${H-1}" font-size="9" text-anchor="middle" fill="var(--c-text-tertiary)">${p.d.label}</text>`).join('')}
        ${pts.map(p => p.d.done ? `<text x="${p.x.toFixed(1)}" y="${(p.y-6).toFixed(1)}" font-size="9" text-anchor="middle" fill="var(--c-text-secondary)">${p.d.done}</text>` : '').join('')}
      </svg>
      <div class="stats-info" style="margin-top:6px">
        <div class="stats-info-item">🔥 连续打卡：<strong>${s.streak}</strong> 天</div>
        <div class="stats-info-item">🍅 今日专注：<strong>${s.focus.todayCount}</strong> 次 · <strong>${s.focus.todayMinutes}</strong> 分钟</div>
        <div class="stats-info-item">📈 累计专注：<strong>${s.focus.totalCount}</strong> 次 · <strong>${Math.round(s.focus.totalMinutes/60*10)/10}</strong> 小时</div>
      </div>`;
  },

  updateQuickActions(){
    $$('.quick-chip[data-quick="pri"]').forEach(b => {
      b.classList.toggle('active', b.dataset.val===Store.quickPri);
    });
    $$('.quick-chip[data-quick="cat"]').forEach(b => {
      b.classList.toggle('active', b.dataset.val===Store.quickCat);
    });
  },

  modal(title, content, actions){
    const overlay = $('#modalOverlay');
    const modal = $('#modalContent');
    modal.innerHTML = `<h3>${title}</h3>${content}<div class="modal-actions">${actions.map(a => `<button class="modal-btn ${a.cls||'secondary'}" data-modal-action="${a.key}">${a.label}</button>`).join('')}</div>`;
    overlay.classList.add('open');
    return overlay;
  },

  closeModal(){ $('#modalOverlay').classList.remove('open'); },
};

/* ═══════════════════════════════════════════════════════════════
   DRAG & DROP
   ═══════════════════════════════════════════════════════════════ */
const DragDrop = {
  draggedIdx: -1,

  handleDragStart(e){
    const card = e.target.closest('.task-card');
    if(!card || e.target.dataset.action==='expand'||e.target.dataset.action==='toggle'||e.target.dataset.action==='openDetail'||e.target.dataset.action==='delete') return;
    this.draggedIdx = parseInt(card.dataset.idx);
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.id);
  },

  handleDragEnd(e){
    const card = e.target.closest('.task-card');
    if(card) card.classList.remove('dragging');
    $$('.drag-over').forEach(c => c.classList.remove('drag-over'));
    this.draggedIdx = -1;
  },

  handleDragOver(e){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const card = e.target.closest('.task-card');
    if(!card) return;
    $$('.drag-over').forEach(c => c.classList.remove('drag-over'));
    const idx = parseInt(card.dataset.idx);
    if(idx !== this.draggedIdx) card.classList.add('drag-over');
  },

  handleDrop(e){
    e.preventDefault();
    const card = e.target.closest('.task-card');
    if(!card) return;
    const toIdx = parseInt(card.dataset.idx);
    if(this.draggedIdx>=0 && toIdx>=0 && this.draggedIdx!==toIdx){
      Ops.reorder(this.draggedIdx, toIdx);
      Render.all();
    }
    this.draggedIdx = -1;
  },

  init(){
    const list = $('#taskList');
    list.addEventListener('dragstart', e => this.handleDragStart(e));
    list.addEventListener('dragend', e => this.handleDragEnd(e));
    list.addEventListener('dragover', e => this.handleDragOver(e));
    list.addEventListener('drop', e => this.handleDrop(e));
  },
};

/* ═══════════════════════════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════════════════════════ */
function initEvents(){
  // ── Add task ──────────────────────────────────────────
  const taskInput = $('#taskInput');
  const addBtn = $('#addBtn');
  addBtn.addEventListener('click', () => { Ops.add(taskInput.value); taskInput.value=''; taskInput.focus(); Render.all(); });
  taskInput.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); Ops.add(taskInput.value); taskInput.value=''; Render.all(); } });

  // ── Task list delegation ──────────────────────────────
  $('#taskList').addEventListener('click', e => {
    const action = e.target.dataset.action;
    const card = e.target.closest('.task-card');
    if(!card) return;
    const id = card.dataset.id;

    switch(action){
      case 'toggle': Ops.toggle(id); Render.all(); break;
      case 'delete':
        const t = Store.tasks.find(t=>t.id===id);
        Ops.softDelete(id);
        Render.all();
        if(t) Toast.show(`已删除「${t.text.slice(0,20)}」`, '撤销', () => { Ops.restore(id); Render.all(); });
        break;
      case 'restore': Ops.restore(id); Render.all(); Toast.show('已恢复'); break;
      case 'permDelete':
        const pt = Store.tasks.find(t=>t.id===id);
        Ops.permanentDelete(id);
        Render.all();
        Toast.show(`已永久删除「${(pt?.text||'').slice(0,20)}」`);
        break;
      case 'expand':
        if(Store.expandedIds.has(id)) Store.expandedIds.delete(id);
        else Store.expandedIds.add(id);
        Render.taskList();
        break;
      case 'openDetail':
        const dt = Store.tasks.find(t=>t.id===id);
        if(dt) Render.detailPanel(dt);
        break;
      case 'drag':
        Keyboard.select(id);
        break;
      case 'toggleSub':
        Ops.toggleSubtask(id, e.target.dataset.subid);
        Render.all();
        break;
    }
  });

  // 单击任务卡任意位置 → 记为键盘选中项（方便接着用方向键）
  $('#taskList').addEventListener('click', e => {
    const card = e.target.closest('.task-card');
    if(card) Keyboard.select(card.dataset.id);
  });

  // ── Detail panel events ───────────────────────────────
  $('#detailBody').addEventListener('click', e => {
    const action = e.target.dataset.action;
    if(!action || !Store.detailId) return;
    const id = Store.detailId;
    switch(action){
      case 'setPri': Ops.update(id, { priority: e.target.dataset.val }); Render.all(); Render.detailPanel(Store.tasks.find(t=>t.id===id)); break;
      case 'setCat': Ops.update(id, { category: e.target.dataset.val||null }); Render.all(); Render.detailPanel(Store.tasks.find(t=>t.id===id)); break;
      case 'toggleSubDetail': Ops.toggleSubtask(id, e.target.dataset.subid); Render.detailPanel(Store.tasks.find(t=>t.id===id)); Render.all(); break;
      case 'deleteSubDetail': Ops.deleteSubtask(id, e.target.dataset.subid); Render.detailPanel(Store.tasks.find(t=>t.id===id)); Render.all(); break;
      case 'deleteFromDetail':
        const t = Store.tasks.find(t=>t.id===id);
        Ops.softDelete(id);
        Render.closeDetail();
        Render.all();
        if(t) Toast.show(`已删除「${t.text.slice(0,20)}」`, '撤销', () => { Ops.restore(id); Render.all(); });
        break;
    }
  });

  $('#detailBody').addEventListener('change', e => {
    const action = e.target.dataset.action;
    if(!action || !Store.detailId) return;
    const id = Store.detailId;
    switch(action){
      case 'setDate': Ops.update(id, { dueDate: e.target.value||null }); Render.all(); break;
      case 'setTime': Ops.update(id, { dueTime: e.target.value||null }); Render.all(); break;
      case 'setRepeat':
        const val = e.target.value;
        Ops.update(id, { repeat: val ? { type: val, interval: 1 } : null });
        break;
      case 'setRemindBefore':
        Ops.update(id, { remindBefore: parseInt(e.target.value,10)||0 });
        Render.all();
        Toast.show(e.target.value==='0' ? '已设为准点提醒' : '已设为' + e.target.selectedOptions[0].textContent);
        break;
      case 'setRemindDate':
      case 'setRemindTime': {
        const dateEl = $('#detailBody').querySelector('[data-action="setRemindDate"]');
        const timeEl = $('#detailBody').querySelector('[data-action="setRemindTime"]');
        const date = dateEl ? dateEl.value : '';
        const time = timeEl ? timeEl.value : '';
        if(!date && !time){ Ops.setRemind(id, null); Render.all(); break; }
        const ts = parseLocalDateTime(date || todayStr(), time || Store.settings.defaultRemindTime);
        if(ts){ Ops.setRemind(id, ts); Render.all(); Toast.show('提醒：' + fmtDateTime(ts)); }
        break;
      }
    }
  });

  // debounced notes
  const notesDebounce = debounce((id, val) => { Ops.update(id, { notes: val }); }, 500);
  $('#detailBody').addEventListener('input', e => {
    if(e.target.dataset.action==='setNotes' && Store.detailId){
      notesDebounce(Store.detailId, e.target.value);
    }
  });

  // subtask add (Enter key)
  $('#detailBody').addEventListener('keydown', e => {
    if(e.key==='Enter' && e.target.dataset.action==='addSubtask' && Store.detailId){
      e.preventDefault();
      const val = e.target.value.trim();
      if(!val) return;
      Ops.addSubtask(Store.detailId, val);
      e.target.value = '';
      Render.detailPanel(Store.tasks.find(t=>t.id===Store.detailId));
      Render.all();
    }
  });

  // Parse NL date
  $('#detailBody').addEventListener('click', e => {
    const action = e.target.dataset.action;
    if(!Store.detailId) return;
    if(action === 'remindIn'){ Actions.remindIn(Store.detailId, parseInt(e.target.dataset.val,10)); Render.detailPanel(Store.tasks.find(t=>t.id===Store.detailId)); }
    if(action === 'remindTonight'){ Actions.remindTonight(Store.detailId); Render.detailPanel(Store.tasks.find(t=>t.id===Store.detailId)); }
    if(action === 'remindOff'){ Ops.setRemind(Store.detailId, null); Render.all(); Render.detailPanel(Store.tasks.find(t=>t.id===Store.detailId)); Toast.show('已关闭提醒'); }
    if(action === 'togglePersist'){
      const t = Store.tasks.find(x=>x.id===Store.detailId);
      if(t){ Ops.update(t.id, { remindPersist: !t.remindPersist }); Render.detailPanel(t); Render.all(); Toast.show(t.remindPersist ? '已设为重要提醒' : '已取消重要提醒'); }
    }
    if(action === 'focusThis'){ Actions.focusTask(Store.detailId); }
    if(action === 'parseNl'){
      const input = $('#detailBody').querySelector('[data-action="nlDate"]');
      if(!input) return;
      const result = NLParser.parse(input.value);
      if(result){
        Ops.update(Store.detailId, { dueDate: result });
        input.value = '';
        Render.detailPanel(Store.tasks.find(t=>t.id===Store.detailId));
        Render.all();
        Toast.show(`已设置日期：${fmtDate(result)}`);
      } else {
        Toast.show('无法解析日期，请尝试：明天、下周三、3天后');
      }
    }
  });

  // ── Close detail ──────────────────────────────────────
  $('#detailClose').addEventListener('click', Render.closeDetail);
  $('#detailOverlay').addEventListener('click', Render.closeDetail);

  // ── Filters ───────────────────────────────────────────
  $$('.filter-pill').forEach(b => {
    if(!b.dataset.filter) return;   // 「今天」按钮由独立处理器负责
    b.addEventListener('click', () => Filters.set(b.dataset.filter));
  });

  $$('.cat-chip').forEach(b => {
    b.addEventListener('click', () => {
      Store.catFilter = b.dataset.cat;
      $$('.cat-chip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      Render.all();
    });
  });

  // ── Search ────────────────────────────────────────────
  const searchBar = $('#searchBar');
  const searchInput = $('#searchInput');
  const searchClear = $('#searchClear');
  $('#searchToggle').addEventListener('click', () => {
    const open = searchBar.classList.toggle('open');
    if(open) searchInput.focus(); else { searchInput.value=''; Store.searchQuery=''; Render.all(); }
  });
  searchInput.addEventListener('input', () => {
    Store.searchQuery = searchInput.value.trim();
    searchClear.hidden = !Store.searchQuery;
    Render.all();
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = ''; Store.searchQuery = '';
    searchClear.hidden = true;
    Render.all();
  });

  // ── Quick actions ─────────────────────────────────────
  $('#quickActions').addEventListener('click', e => {
    const chip = e.target.closest('.quick-chip');
    if(!chip) return;
    const type = chip.dataset.quick;
    const val = chip.dataset.val;
    if(type==='pri'){
      Store.quickPri = Store.quickPri===val ? null : val;
    } else if(type==='cat'){
      Store.quickCat = Store.quickCat===val ? null : val;
    }
    Render.updateQuickActions();
    // Also update filter pills
    $$('.filter-pill').forEach(b => { b.classList.toggle('active', b.dataset.filter===Store.filter); });
    $$('.cat-chip').forEach(b => { b.classList.toggle('active', b.dataset.cat===Store.catFilter); });
  });

  // ── Modal helpers ─────────────────────────────────────
  // 点击弹窗内部元素（如输入框）不应消耗监听器，仅在点到动作按钮时处理并自移除
  function onModalAction(handler){
    const fn = e => {
      const act = e.target.dataset.modalAction;
      if(!act) return;
      $('#modalContent').removeEventListener('click', fn);
      handler(act);
    };
    $('#modalContent').addEventListener('click', fn);
  }

  // ── Trash ─────────────────────────────────────────────
  $('#viewTrash').addEventListener('click', () => { Store.viewMode='trash'; Render.all(); });
  $('#exitTrash').addEventListener('click', () => { Store.viewMode='tasks'; Render.all(); });
  $('#emptyTrash').addEventListener('click', () => {
    const count = Query.getTrash().length;
    if(count===0) return;
    Render.modal('清空回收站', `<p>确定要永久删除回收站中的 ${count} 项任务吗？此操作不可撤销。</p>`, [
      { key:'cancel', label:'取消', cls:'secondary' },
      { key:'confirm', label:'清空', cls:'danger' },
    ]);
    onModalAction(act => {
      if(act==='confirm'){ Ops.emptyTrash(); Render.closeModal(); Render.all(); Toast.show('回收站已清空'); }
      if(act==='cancel') Render.closeModal();
    });
  });

  // ── Clear completed ───────────────────────────────────
  $('#clearCompleted').addEventListener('click', () => {
    const count = Store.tasks.filter(t => !t.deleted && t.done).length;
    if(count===0) return;
    Render.modal('清除已完成', `<p>确定要清除所有 ${count} 项已完成任务吗？它们将被移至回收站。</p>`, [
      { key:'cancel', label:'取消', cls:'secondary' },
      { key:'confirm', label:'清除', cls:'danger' },
    ]);
    onModalAction(act => {
      if(act==='confirm'){
        Store.tasks.forEach(t => { if(!t.deleted && t.done) Ops.softDelete(t.id); });
        Render.closeModal(); Render.all(); Toast.show(`已清除 ${count} 项`, '撤销', () => { Store.tasks.forEach(t => { if(t.deleted&&t.done)Ops.restore(t.id); }); Render.all(); });
      }
      if(act==='cancel') Render.closeModal();
    });
  });

  // ── Theme toggle ──────────────────────────────────────
  $('#themeToggle').addEventListener('click', () => {
    // 依据保存的模式（而非解析后的主题）循环：浅色 → 深色 → 跟随系统
    const cur = localStorage.getItem('todo_theme') || 'auto';
    const next = cur==='light'?'dark':(cur==='dark'?'auto':'light');
    applyTheme(next);
    Store.theme = next;
    localStorage.setItem('todo_theme', next);
  });

  // ── 设置面板 ──────────────────────────────────────────
  $('#settingsToggle').addEventListener('click', () => Settings.open());
  $('#modalContent').addEventListener('change', e => Settings.onChange(e));
  $('#modalContent').addEventListener('click', e => Settings.onClick(e));

  // ── 提醒闹钟 ──────────────────────────────────────────
  $('#alarmCard').addEventListener('click', e => {
    const act = e.target.dataset.alarm;
    if(!act || !Alarm.item) return;
    Reminders.ack(Alarm.item, act);
  });

  // ── 今日视图 / 日期筛选 / 后台状态 ────────────────────
  $('#todayPill').addEventListener('click', () => Filters.toggleToday());
  $('#dateFilterClear').addEventListener('click', () => { Store.dateFilter = null; Render.all(); if(Store.sideTab==='calendar') Calendar.render(); });
  $('#companionChip').addEventListener('click', () => Settings.open());
  $('#modeBannerAction').addEventListener('click', () => Settings.open());
  $('#modeBannerClose').addEventListener('click', () => { Store.settings.bannerDismissed = true; Store.saveAux(); $('#modeBanner').classList.add('hidden'); });

  // ── Export / Import ───────────────────────────────────
  $('#exportBtn').addEventListener('click', () => {
    const json = JSON.stringify(Store.tasks.filter(t=>!t.deleted), null, 2);
    Render.modal('导出任务', `<textarea readonly id="exportText">${esc(json)}</textarea>`, [
      { key:'copy', label:'复制', cls:'primary' },
      { key:'download', label:'下载', cls:'secondary' },
      { key:'cancel', label:'关闭', cls:'secondary' },
    ]);
    onModalAction(act => {
      if(act==='copy'){
        navigator.clipboard.writeText(json).then(()=>Toast.show('已复制到剪贴板'));
        Render.closeModal();
      }
      if(act==='download'){
        const blob = new Blob([json],{type:'application/json'});
        const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='todo-backup.json'; a.click();
        Render.closeModal();
      }
      if(act==='cancel') Render.closeModal();
    });
  });

  $('#importBtn').addEventListener('click', () => {
    Render.modal('导入任务', `<textarea id="importText" placeholder="在此粘贴 JSON 数据…"></textarea><input type="file" id="importFile" accept=".json" style="font-size:var(--fs-sm)">`, [
      { key:'import', label:'导入', cls:'primary' },
      { key:'cancel', label:'取消', cls:'secondary' },
    ]);
    onModalAction(act => {
      if(act==='import'){
        const text = $('#importText').value.trim();
        if(text){
          try{
            const data = JSON.parse(text);
            if(!Array.isArray(data)) throw new Error('格式错误');
            let imported = 0;
            data.forEach(item => {
              if(item.text){
                Store.tasks.unshift({
                  id: uid(), text: item.text, done: false, createdAt: Date.now(), updatedAt: Date.now(),
                  completedAt: null, priority: item.priority||'none', dueDate: item.dueDate||null,
                  dueTime: item.dueTime||null, category: item.category||null,
                  subtasks: (item.subtasks||[]).map(s=>({id:uid(),text:s.text||'',done:false})),
                  notes: item.notes||'', repeat: item.repeat||null, deleted: false, deletedAt: null,
                });
                imported++;
              }
            });
            Store.save(); Render.closeModal(); Render.all();
            Toast.show(`成功导入 ${imported} 项任务`);
          }catch(err){ Toast.show('导入失败：JSON 格式无效'); }
        }
      }
      if(act==='cancel') Render.closeModal();
    });
    // File import
    $('#importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => { $('#importText').value = reader.result; };
      reader.readAsText(file);
    });
  });

  // ── Modal overlay click ───────────────────────────────
  $('#modalOverlay').addEventListener('click', e => { if(e.target===$('#modalOverlay')) Render.closeModal(); });

  // ── Keyboard shortcuts ────────────────────────────────
  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    // 闹钟 / 右键菜单 / 教程打开时，按键优先给它们
    if(Alarm.item){ if(e.key==='Escape') Reminders.ack(Alarm.item, 'close'); return; }
    if(ContextMenu.isOpen()){ if(e.key==='Escape') ContextMenu.close(); return; }
    if(Tutorial.isActive()) return;
    if(mod && e.key==='k'){ e.preventDefault(); $('#searchBar').classList.add('open'); $('#searchInput').focus(); }
    if(mod && e.key==='f'){ e.preventDefault(); $('#searchBar').classList.add('open'); $('#searchInput').focus(); }
    if(mod && e.key==='n'){ e.preventDefault(); $('#taskInput').focus(); }
    if(mod && e.key==='z'){ e.preventDefault(); const last=Store.undoStack.pop(); if(last){ Ops.restore(last.id); Render.all(); Toast.show('已撤销删除'); } }
    if(mod && e.key==='l'){ e.preventDefault(); SidePanel.open('calendar'); }
    if(mod && e.shiftKey && e.key==='D'){ e.preventDefault(); $('#themeToggle').click(); }
    if(!mod && Keyboard.onKey(e)) return;
    if(e.key==='Escape'){
      if($('#modalOverlay').classList.contains('open')) Render.closeModal();
      else if(!SidePanel.isWide() && $('#detailPanel').classList.contains('open')) Render.closeDetail();
      else if(Store.detailId) Render.closeDetail();
      else if(Store.searchQuery){ $('#searchClear').click(); }
      else if($('#searchBar').classList.contains('open')){ $('#searchBar').classList.remove('open'); }
      else if(Store.dateFilter || Store.todayView){ Store.dateFilter=null; Store.todayView=false; Render.all(); }
      else $('#taskInput').blur();
    }
  });
}

Render.closeDetail = function(){
  $('#detailPanel').classList.remove('open');
  $('#detailOverlay').classList.remove('open');
  Store.detailId = null;
  if(SidePanel.isWide() && Store.sideTab === 'detail') Render.detailPanel(null);
};

/* ═══════════════════════════════════════════════════════════════
   THEME
   ═══════════════════════════════════════════════════════════════ */
function applyTheme(mode){
  const html = document.documentElement;
  const sun = $('#themeToggle .sun');
  const moon = $('#themeToggle .moon');
  let resolved;
  if(mode==='auto'){
    resolved = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  } else {
    resolved = mode;
  }
  html.dataset.theme = resolved;
  // Update icon
  if(resolved==='dark'){ sun.style.display='none'; moon.style.display=''; }
  else { sun.style.display=''; moon.style.display='none'; }
}

function initTheme(){
  let saved = localStorage.getItem('todo_theme') || 'auto';
  Store.theme = saved;
  applyTheme(saved);
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => {
    if(Store.theme==='auto') applyTheme('auto');
  });
}

/** 列表密度：舒适 / 紧凑 */
function applyDensity(mode){
  document.documentElement.dataset.density = (mode === 'compact') ? 'compact' : 'comfortable';
}

function updateDateDisplay(){
  const now = new Date();
  $('#dateDisplay').textContent = now.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
}

// Polyfill: startViewTransition fallback
if(!document.startViewTransition){
  document.startViewTransition = fn => ({ ready: Promise.resolve().then(fn) });
}

  init(){
    $('#helpBtn').addEventListener('click', () => this.start());
    $('#tutOverlay').addEventListener('click', () => {}); // block click-through
    $('#tutNext').addEventListener('click', () => this.next());
    $('#tutPrev').addEventListener('click', () => this.prev());
    $('#tutSkip').addEventListener('click', () => this.end());
    $('#tutFinish').addEventListener('click', () => this.end());
    document.addEventListener('keydown', e => {
      if(!this.isActive()) return;
      if(e.key==='Escape') this.end();
      if(e.key==='ArrowRight') this.next();
      if(e.key==='ArrowLeft') this.prev();
    });
    // Auto-start on first visit
    if(!localStorage.getItem('todo_tutorial_seen')){
      setTimeout(() => this.start(), 600);
    }
  },

  isActive(){ return this.currentStep >= 0; },

  start(){
    this.currentStep = 0;
    this.showStep();
  },

  end(){
    this.currentStep = -1;
    $('#tutOverlay').classList.remove('active');
    $('#tutSpotlight').hidden = true;
    $('#tutTooltip').hidden = true;
    localStorage.setItem('todo_tutorial_seen', '1');
    this.seen = true;
  },

  next(){
    if(this.currentStep < this.steps.length-1){
      this.currentStep++;
      this.showStep();
    } else {
      this.end();
    }
  },

  prev(){
    if(this.currentStep > 0){
      this.currentStep--;
      this.showStep();
    }
  },

  showStep(){
    const step = this.steps[this.currentStep];
    const isFirst = this.currentStep === 0;
    const isLast = this.currentStep === this.steps.length - 1;

    // Overlay
    $('#tutOverlay').classList.add('active');

    // Spotlight
    const spot = $('#tutSpotlight');
    spot.hidden = false;
    if(step.target === '#detailBody') SidePanel.setTab('detail');

    if(step.pos==='center' || !step.target){
      spot.className = 'tutorial-spotlight center';
    } else {
      spot.className = 'tutorial-spotlight';
      const el = document.querySelector(step.target);
      const rect = el ? el.getBoundingClientRect() : null;
      if(rect && rect.width > 0 && rect.height > 0){
        spot.style.top = (rect.top - 6) + 'px';
        spot.style.left = (rect.left - 6) + 'px';
        spot.style.width = (rect.width + 12) + 'px';
        spot.style.height = (rect.height + 12) + 'px';
      } else {
        spot.className = 'tutorial-spotlight center';
      }
    }

    // Tooltip
    const tip = $('#tutTooltip');
    tip.hidden = false;
    $('#tutTitle').innerHTML = step.title;
    $('#tutContent').innerHTML = step.content;
    $('#tutTip').innerHTML = step.tip ? `<div class="tut-tip">${step.tip}</div>` : '';

    // Position tooltip
    tip.classList.remove('center-card');
    // 目标在侧栏详情里时，先把侧栏切到对应标签，避免高亮到隐藏元素
    if(step.target === '#detailBody') SidePanel.setTab('detail');
    const targetEl = step.target ? document.querySelector(step.target) : null;
    const targetVisible = targetEl && targetEl.getBoundingClientRect().width > 0 && targetEl.getBoundingClientRect().height > 0;
    if(step.pos==='center' || !targetVisible){
      tip.classList.add('center-card');
      tip.style.top = tip.style.left = tip.style.bottom = tip.style.right = '';
      tip.style.transform = 'translate(-50%,-50%)';
    } else {
      const el = targetEl;
      const r = el.getBoundingClientRect();
      const margin = 16;
      let top, left, transform = '';

      switch(step.pos){
        case 'bottom':
          top = r.bottom + margin;
          left = Math.max(16, Math.min(r.left + r.width/2, window.innerWidth - 186));
          transform = 'translateX(-50%)';
          break;
        case 'top':
          top = r.top - margin;
          left = Math.max(16, Math.min(r.left + r.width/2, window.innerWidth - 186));
          transform = 'translate(-50%,-100%)';
          break;
        case 'left':
          top = r.top + r.height/2;
          left = r.left - margin;
          transform = 'translate(-100%,-50%)';
          break;
        case 'right':
          top = r.top + r.height/2;
          left = r.right + margin;
          transform = 'translate(0,-50%)';
          break;
      }
      // Keep within viewport
      tip.style.top = Math.max(16, Math.min(top, window.innerHeight - 200)) + 'px';
      tip.style.left = Math.max(16, Math.min(left, window.innerWidth - 356)) + 'px';
      tip.style.transform = transform;
    }

    // Navigation buttons
    $('#tutPrev').hidden = isFirst;
    $('#tutSkip').hidden = isLast;
    $('#tutNext').hidden = isLast;
    $('#tutFinish').hidden = !isLast;

    // Dots
    const total = this.steps.length;
    $('#tutDots').innerHTML = this.steps.map((_, i) => {
      let cls = 'tut-dot';
      if(i < this.currentStep) cls += ' done';
      if(i === this.currentStep) cls += ' current';
      return `<div class="${cls}"></div>`;
    }).join('');
  },
};

  if(todayStr() !== _lastDate){
    _lastDate = todayStr();
    updateDateDisplay();
    if(Store.sideTab==='calendar') Calendar.render();

  }

try{
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('today_app') : null;
  if(bc){
    window.__bc = bc;
    bc.onmessage = ev => {
      if(!ev.data || ev.data.type !== 'changed') return;
      Store.saving = true;
      Store.load();
      Store.saving = false;
      Render.all();
    };
  }
}catch(e){}
window.addEventListener('storage', e => {
  if(e.key && e.key.indexOf('todo_') === 0 && !Store.saving){
    Store.load();
    Render.all();
  }
});

  }, 1200);
}
