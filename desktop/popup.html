<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>今日事 · 提醒</title>
<style>
  :root{
    --glass:rgba(24,26,33,.72); --glass-hi:rgba(255,255,255,.14);
    --text:#f5f5f7; --text-2:#98989d; --border:rgba(255,255,255,.1);
    --blue:#0a84ff; --green:#30d158;
    --spring:cubic-bezier(.34,1.45,.6,1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; font-family:"SF Pro Display","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif; }
  html,body{ height:100%; overflow:hidden; background:transparent; }
  body{ -webkit-app-region:drag; display:flex; align-items:center; justify-content:center; }
  .card{
    width:100%; height:100%; background:var(--glass);
    backdrop-filter:blur(30px) saturate(1.7); -webkit-backdrop-filter:blur(30px) saturate(1.7);
    border:1px solid var(--border); border-radius:22px;
    box-shadow:0 24px 70px rgba(0,0,0,.4), inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px rgba(255,255,255,.05);
    padding:18px 20px 16px; display:flex; flex-direction:column; position:relative;
    animation:cardIn .45s var(--spring);
  }
  @keyframes cardIn{ from{ opacity:0; transform:scale(.9) translateY(16px); } to{ opacity:1; transform:none; } }
  .head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bell{ width:38px; height:38px; border-radius:13px;
         background:linear-gradient(160deg,#3f9dff,#0a84ff);
         box-shadow:0 4px 14px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.35);
         display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;
         animation:ring 1.4s ease-in-out infinite; }
  @keyframes ring{ 0%,100%{ transform:rotate(0) } 12%{ transform:rotate(15deg) } 24%{ transform:rotate(-13deg) } 36%{ transform:rotate(8deg) } 48%{ transform:rotate(0) } }
  .title{ font-weight:700; font-size:14px; color:var(--text-2); }
  .time{ font-size:12px; color:var(--text-2); margin-top:1px; }
  .close-x{ -webkit-app-region:no-drag; position:absolute; top:12px; right:12px; width:26px; height:26px;
            border:none; background:rgba(255,255,255,.08); color:var(--text-2); font-size:13px; cursor:pointer;
            border-radius:50%; transition:all .25s var(--spring); }
  .close-x:hover{ background:rgba(255,255,255,.16); color:var(--text); }
  .close-x:active{ transform:scale(.85); }
  .body{ flex:1; display:flex; align-items:center; overflow:hidden; }
  .text{ font-size:17px; font-weight:700; line-height:1.45; color:var(--text);
         max-height:96px; overflow-y:auto; word-break:break-all; -webkit-app-region:no-drag; letter-spacing:-.01em; }
  .persist-tip{ font-size:12px; color:#ff9f0a; margin-top:6px; -webkit-app-region:no-drag; }
  .btns{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding-top:14px; }
  button.act{
    -webkit-app-region:no-drag; padding:10px 0; border-radius:13px; border:1px solid var(--border);
    background:rgba(255,255,255,.07); color:var(--text); font-size:12.5px; font-weight:600;
    cursor:pointer; transition:all .25s var(--spring);
  }
  button.act:hover{ background:rgba(255,255,255,.14); transform:translateY(-1px); }
  button.act:active{ transform:scale(.92); }
  button.act.primary{ background:linear-gradient(160deg,#3ddc6a,#24a148); border-color:transparent;
                      box-shadow:0 4px 14px rgba(48,209,88,.35); }
  button.act.primary:hover{ box-shadow:0 6px 20px rgba(48,209,88,.45); }
</style>
</head>
<body>
  <div class="card">
    <button class="close-x" data-act="close" title="关闭">✕</button>
    <div class="head">
      <div class="bell">🔔</div>
      <div>
        <div class="title">今日事 · 到点提醒</div>
        <div class="time" id="atTime"></div>
      </div>
    </div>
    <div class="body">
      <div>
        <div class="text" id="taskText"></div>
        <div class="persist-tip" id="persistTip" hidden>⏰ 重要提醒：未处理每 5 分钟会再响一次</div>
      </div>
    </div>
    <div class="btns">
      <button class="act primary" data-act="done">✓ 完成</button>
      <button class="act" data-act="snooze5">稍后 5 分钟</button>
      <button class="act" data-act="snooze10">稍后 10 分钟</button>
      <button class="act" data-act="snooze30">稍后 30 分钟</button>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('taskText').textContent = q.get('text') || '（无内容）';
  document.getElementById('atTime').textContent = '提醒时间：' + (q.get('at') || '');
  if (q.get('persist') === '1') document.getElementById('persistTip').hidden = false;
  const key = q.get('key') || '', taskId = q.get('taskId') || '';
  document.querySelectorAll('button.act, button.close-x').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (act === 'close') window.popupApi.sendAction('close', key, taskId);
      else window.popupApi.sendAction(act, key, taskId);
    });
  });
</script>
</body>
</html>
